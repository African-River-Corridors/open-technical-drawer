[package]
name = "otd"
description = "The Drawing Format Standard in Rust: drawing document to normalised content, then SVG, PDF and DXF."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/African-River-Corridors/open-technical-drawer"
publish = false

# Pure Rust and domain-free: no vessel or waterway crate. The core takes strings and values in and
# out; it opens no file, reads no clock and uses no network. Every transcendental goes through libm
# so a result is the same on every platform.
[dependencies]
# float_roundtrip, arbitrary_precision: read every number exactly as written, big ints too.
# preserve_order: a JSON object keeps its key order, as a Python dict does.
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision", "preserve_order"] }
sha2 = "0.11.1"
libm = "0.2"
regex-lite = "0.1"
# PDF: pdf-writer (the typst project's low-level writer), ttf-parser for the font tables, miniz_oxide for
# deflate. All pure Rust, none opens a file.
pdf-writer = "0.15"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
miniz_oxide = "0.8"
# JPEG: integer DCT and colour conversion only, no floating point, so the bytes are the same on every
# platform. Without the default features it is no_std and opens no file.
jpeg-encoder = { version = "0.7", default-features = false }

# Second readers for the output tests: they are not the code that writes the files.
[dev-dependencies]
lopdf = { version = "0.45", default-features = false }
roxmltree = "0.21"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
